# Supabase CLI settings (https://supabase.com/docs/guides/cli/config)
project_id = "elite-education"

# Called by Stripe, not the app — authenticated by the Stripe signature instead.
[functions.stripe-webhook]
verify_jwt = false

# Calendar apps can't send a login; the feed is protected by each user's secret token.
[functions.ics]
verify_jwt = false

# Google redirects back here after consent without a login, so the platform JWT check is off.
# The 'start' and 'disconnect' actions check the caller's session themselves, and the callback is
# protected by a single-use state value that expires after 15 minutes.
[functions.google-connect]
verify_jwt = false

# Launch readiness functions keep the platform JWT check on (no sections needed):
#   delete-account  called by the app with the person's login (closing their own account, or an admin carrying out a request).
#   health-check    schedule every 15 minutes with Authorization: Bearer <service role key>; emails HEALTH_ALERT_EMAIL.
#   backup-export   schedule daily at 22:10 UTC (02:10 UAE) with Authorization: Bearer <service role key>.

# The public website calls this before a visitor is signed in; Cloudflare Turnstile protects it instead.
[functions.verify-captcha]
verify_jwt = false
